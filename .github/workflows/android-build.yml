
name: Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'iOS_Fusion_Launcher_2.0.0_Sprint1_Source.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract source
        run: |
          mkdir source
          unzip -q iOS_Fusion_Launcher_2.0.0_Sprint1_Source.zip -d source
          find source -maxdepth 3 -type f | head -50

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: source
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Fusion-Launcher-2.0.0-Sprint1
          path: source/**/build/outputs/apk/debug/*.apk
          
